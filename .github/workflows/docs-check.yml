# Watched design/behaviour paths are defined at the top of scripts/check-pr-docs.mjs
name: Docs check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [preview, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # issues: write only here; no checkout, no repo scripts.
  ensure-no-docs-needed-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ensure no-docs-needed label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "no-docs-needed" \
            --description "Skip the Docs check when a PR changes UI/build files but needs no docs/ update." \
            --color "0E8A16" 2>/dev/null || true

  docs-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List changed files
        id: changed
        run: |
          git fetch --no-tags --prune --no-recurse-submodules \
            origin "${{ github.event.pull_request.base.sha }}"
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > changed-files.txt
          cat changed-files.txt

      - name: Require docs/ for watched UI changes
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          export CHANGED_FILES="$(cat changed-files.txt)"
          node scripts/check-pr-docs.mjs
