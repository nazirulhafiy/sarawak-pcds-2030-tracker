# Watched design/behaviour paths are defined at the top of scripts/check-pr-docs.mjs
name: Docs check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [preview, main]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure no-docs-needed label exists
        uses: actions/github-script@ed597411d8f32442eaed0e2987e2ee1d7c167bd5 # v8.0.0
        with:
          script: |
            const name = 'no-docs-needed';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                color: '0E8A16',
                description:
                  'Skip the Docs check when a PR changes UI/build files but needs no docs/ update.',
              });
            }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List changed files
        id: changed
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > changed-files.txt
          cat changed-files.txt

      - name: Require docs/ for watched UI changes
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          export CHANGED_FILES="$(cat changed-files.txt)"
          node scripts/check-pr-docs.mjs
